name: UI tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:          # adds a "Run workflow" button
    inputs:
      tags:
        description: 'Cucumber tags, e.g. @high. Default @ready. Type all to run everything'
        required: false
        default: '@ready'

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Start Selenium Grid
        run: docker compose up -d

      - name: Wait for Grid to be ready
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:4444/status | grep -q '"ready": true' && exit 0
            sleep 2
          done
          echo "Grid not ready"; docker compose logs; exit 1

      - name: Run tests
        env:
          TAGS: ${{ github.event.inputs.tags || '@ready'}}
        run: |
          if [ "$TAGS" = "all" ]; then
            mvn -B clean test -Dgrid.url=http://localhost:4444
          else
            mvn -B clean test -Dgrid.url=http://localhost:4444 -Dcucumber.filter.tags="$TAGS"
          fi

      - name: Upload Cucumber report
        if: always()            # upload even when tests fail
        uses: actions/upload-artifact@v7
        with:
          name: cucumber-report
          path: target/cucumber-reports/

      - name: Stop Grid
        if: always()
        run: docker compose down