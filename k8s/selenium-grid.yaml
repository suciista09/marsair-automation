apiVersion: apps/v1
kind: Deployment
metadata: { name: selenium-hub }
spec:
  replicas: 1
  selector: { matchLabels: { app: selenium-hub } }
  template:
    metadata: { labels: { app: selenium-hub } }
    spec:
      containers:
        - name: hub
          image: selenium/hub:4.27.0
          ports: [ { containerPort: 4444 }, { containerPort: 4442 }, { containerPort: 4443 } ]
---
apiVersion: v1
kind: Service              # stable name "selenium-hub" inside the cluster
metadata: { name: selenium-hub }
spec:
  selector: { app: selenium-hub }
  ports:
    - { name: web, port: 4444 }
    - { name: publish, port: 4442 }
    - { name: subscribe, port: 4443 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: chrome-node }
spec:
  replicas: 3
  selector: { matchLabels: { app: chrome-node } }
  template:
    metadata: { labels: { app: chrome-node } }
    spec:
      containers:
        - name: chrome
          image: selenium/node-chromium:4.27.0
          env:
            - { name: SE_EVENT_BUS_HOST, value: selenium-hub }
            - { name: SE_EVENT_BUS_PUBLISH_PORT, value: "4442" }
            - { name: SE_EVENT_BUS_SUBSCRIBE_PORT, value: "4443" }
          volumeMounts: [ { name: dshm, mountPath: /dev/shm } ]
      volumes:
        - name: dshm               # same job as shm_size in Compose
          emptyDir: { medium: Memory, sizeLimit: 2Gi }